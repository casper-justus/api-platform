[package]
name = "api-platform-rust"
version = "0.1.0"
edition = "2021"
description = "Rust utility response API for API Platform"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }

